<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Matrix multiplication by dotting rows with columns</title>
  <desc id="desc">A 2 by 3 matrix times a 3 by 2 matrix is 2 by 2. Each result entry is a row of the first matrix dotted with a column of the second.</desc>
  <defs>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#f8fafc}
      .heading{font:700 18px Arial,sans-serif;fill:#f8fafc}
      .small{font:14px Arial,sans-serif;fill:#cbd5e1}
      .math{font:italic 18px Georgia,serif;fill:#f8fafc}
      .num{font:700 18px Georgia,serif;fill:#0f172a}
      .cell{fill:#e2e8f0;stroke:#bae6fd;stroke-width:2}
      .hot{fill:#fde68a;stroke:#fbbf24;stroke-width:2}
      .out{fill:#86efac;stroke:#4ade80;stroke-width:2}
    </style>
  </defs>
  <rect width="1000" height="520" rx="18" fill="#080c14"/>
  <text x="32" y="40" class="title">Matrix multiplication</text>
  <text x="32" y="68" class="small">(m &#215; n) times (n &#215; p) gives (m &#215; p). Here (2 &#215; 3) times (3 &#215; 2) gives (2 &#215; 2).</text>

  <text x="48" y="112" class="heading">A</text>
  <rect x="40" y="128" width="52" height="40" rx="8" class="hot"/><text x="66" y="154" text-anchor="middle" class="num">1</text>
  <rect x="100" y="128" width="52" height="40" rx="8" class="hot"/><text x="126" y="154" text-anchor="middle" class="num">2</text>
  <rect x="160" y="128" width="52" height="40" rx="8" class="hot"/><text x="186" y="154" text-anchor="middle" class="num">3</text>
  <rect x="40" y="176" width="52" height="40" rx="8" class="cell"/><text x="66" y="202" text-anchor="middle" class="num">4</text>
  <rect x="100" y="176" width="52" height="40" rx="8" class="cell"/><text x="126" y="202" text-anchor="middle" class="num">5</text>
  <rect x="160" y="176" width="52" height="40" rx="8" class="cell"/><text x="186" y="202" text-anchor="middle" class="num">6</text>

  <text x="280" y="190" class="math">&#215;</text>

  <text x="340" y="112" class="heading">B</text>
  <rect x="332" y="128" width="52" height="40" rx="8" class="hot"/><text x="358" y="154" text-anchor="middle" class="num">1</text>
  <rect x="392" y="128" width="52" height="40" rx="8" class="cell"/><text x="418" y="154" text-anchor="middle" class="num">2</text>
  <rect x="332" y="176" width="52" height="40" rx="8" class="hot"/><text x="358" y="202" text-anchor="middle" class="num">0</text>
  <rect x="392" y="176" width="52" height="40" rx="8" class="cell"/><text x="418" y="202" text-anchor="middle" class="num">1</text>
  <rect x="332" y="224" width="52" height="40" rx="8" class="hot"/><text x="358" y="250" text-anchor="middle" class="num">1</text>
  <rect x="392" y="224" width="52" height="40" rx="8" class="cell"/><text x="418" y="250" text-anchor="middle" class="num">0</text>

  <text x="490" y="190" class="math">=</text>

  <text x="560" y="112" class="heading">AB</text>
  <rect x="548" y="150" width="64" height="48" rx="8" class="out"/><text x="580" y="180" text-anchor="middle" class="num">4</text>
  <rect x="622" y="150" width="64" height="48" rx="8" class="cell"/><text x="654" y="180" text-anchor="middle" class="num">4</text>
  <rect x="548" y="208" width="64" height="48" rx="8" class="cell"/><text x="580" y="238" text-anchor="middle" class="num">10</text>
  <rect x="622" y="208" width="64" height="48" rx="8" class="cell"/><text x="654" y="238" text-anchor="middle" class="num">13</text>

  <rect x="720" y="120" width="252" height="180" rx="12" fill="#1c1408" stroke="#fbbf24"/>
  <text x="740" y="152" class="heading">Highlighted entry</text>
  <text x="740" y="188" class="small">1&#215;1 + 2&#215;0 + 3&#215;1</text>
  <text x="740" y="220" class="math">= 4</text>
  <text x="740" y="258" class="small">Row 1 of A dotted with</text>
  <text x="740" y="280" class="small">column 1 of B.</text>

  <rect x="24" y="340" width="952" height="152" rx="14" fill="#0d1626" stroke="#60a5fa"/>
  <text x="44" y="378" class="heading">Shape rule</text>
  <text x="44" y="416" class="math">c_ij = row i of A  &#183;  column j of B</text>
  <text x="44" y="456" class="small">The shared dimension n is summed away. Swapping A and B changes which rows meet which columns.</text>
</svg>
