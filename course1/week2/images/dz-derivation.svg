<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Derivation of dL over dz for logistic regression</title>
  <desc id="desc">The chain rule multiplies dL/da by da/dz. The shared factor a times 1 minus a cancels, leaving dL/dz equals a minus y.</desc>
  <defs>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#f8fafc}
      .heading{font:700 18px Arial,sans-serif;fill:#f8fafc}
      .small{font:14px Arial,sans-serif;fill:#cbd5e1}
      .math{font:italic 18px Georgia,serif;fill:#f8fafc}
      .mathsm{font:italic 15px Georgia,serif;fill:#e2e8f0}
      .amber{font:italic 18px Georgia,serif;fill:#fbbf24}
      .card{fill:#172033;stroke:#7dd3fc;stroke-width:2}
      .loss{fill:#1c1408;stroke:#fbbf24;stroke-width:2}
      .step{fill:#10261a;stroke:#4ade80;stroke-width:2}
      .flow{fill:none;stroke:#fbbf24;stroke-width:2.5;marker-end:url(#amber-arrow)}
    </style>
  </defs>
  <rect width="1000" height="640" rx="18" fill="#080c14"/>
  <text x="32" y="40" class="title">Why dz = a &#8722; y</text>
  <text x="32" y="66" class="small">Chain rule: dL/dz = (dL/da) &#215; (da/dz). The factor a(1&#8722;a) is in both pieces, so it cancels.</text>

  <rect x="24" y="88" width="290" height="150" rx="12" class="card"/>
  <text x="169" y="118" text-anchor="middle" class="heading">Step 1</text>
  <text x="169" y="152" text-anchor="middle" class="math">dL/da</text>
  <text x="169" y="184" text-anchor="middle" class="mathsm">(a &#8722; y) / [a(1&#8722;a)]</text>
  <text x="169" y="214" text-anchor="middle" class="small">from the logistic loss</text>

  <text x="338" y="172" text-anchor="middle" class="amber">&#215;</text>

  <rect x="362" y="88" width="250" height="150" rx="12" class="card"/>
  <text x="487" y="118" text-anchor="middle" class="heading">Step 2</text>
  <text x="487" y="152" text-anchor="middle" class="math">da/dz</text>
  <text x="487" y="184" text-anchor="middle" class="amber">a(1&#8722;a)</text>
  <text x="487" y="214" text-anchor="middle" class="small">sigmoid derivative</text>

  <text x="636" y="172" text-anchor="middle" class="amber">=</text>

  <rect x="664" y="88" width="312" height="150" rx="12" class="step"/>
  <text x="820" y="118" text-anchor="middle" class="heading">Step 3</text>
  <text x="820" y="156" text-anchor="middle" class="math">dL/dz = a &#8722; y</text>
  <text x="820" y="190" text-anchor="middle" class="math">dz = a &#8722; y</text>
  <text x="820" y="216" text-anchor="middle" class="small">the code variable in the videos</text>

  <rect x="24" y="258" width="460" height="292" rx="14" fill="#0d1626" stroke="#60a5fa"/>
  <text x="44" y="290" class="heading">Building dL/da</text>
  <text x="44" y="324" class="mathsm">L = &#8722;[y log a + (1&#8722;y) log(1&#8722;a)]</text>
  <text x="44" y="358" class="mathsm">dL/da = &#8722;y/a + (1&#8722;y)/(1&#8722;a)</text>
  <text x="44" y="392" class="small">Common denominator a(1&#8722;a). Numerator:</text>
  <text x="44" y="424" class="mathsm">&#8722;y(1&#8722;a) + a(1&#8722;y)</text>
  <text x="44" y="458" class="mathsm">= &#8722;y + ay + a &#8722; ay</text>
  <text x="44" y="492" class="mathsm">= a &#8722; y</text>
  <text x="44" y="526" class="small">The ay terms cancel, leaving a &#8722; y on top.</text>

  <rect x="504" y="258" width="472" height="292" rx="14" fill="#160f25" stroke="#c084fc"/>
  <text x="524" y="290" class="heading">Building da/dz</text>
  <text x="524" y="328" class="mathsm">a = &#963;(z) = 1 / (1 + e^(-z))</text>
  <text x="524" y="366" class="mathsm">d&#963;/dz = &#963;(z) (1 &#8722; &#963;(z))</text>
  <text x="524" y="404" class="mathsm">da/dz = a(1 &#8722; a)</text>
  <text x="524" y="450" class="small">Multiply the two steps. The denominator</text>
  <text x="524" y="476" class="small">a(1&#8722;a) from step 1 is the same factor</text>
  <text x="524" y="502" class="small">produced by the sigmoid in step 2.</text>
  <text x="524" y="534" class="amber">Those factors cancel, leaving a &#8722; y.</text>
</svg>
