<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Forward and backward passes through a computation graph</title>
  <desc id="desc">The graph computes J equals 3 times A plus BC, then propagates derivatives backward with the chain rule.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fb7185"/></marker>
    <style>
      .title{font:700 26px Arial,sans-serif;fill:#f8fafc}.heading{font:700 20px Arial,sans-serif;fill:#f8fafc}
      .label{font:18px Arial,sans-serif;fill:#e2e8f0}.small{font:15px Arial,sans-serif;fill:#cbd5e1}
      .math{font:italic 20px Georgia,serif;fill:#f8fafc}.value{font:700 16px Arial,sans-serif;fill:#f8fafc}
      .node{fill:#172033;stroke:#7dd3fc;stroke-width:2}.input{fill:#e2e8f0;stroke:#bae6fd;stroke-width:2}
      .forward{fill:none;stroke:#38bdf8;stroke-width:3;marker-end:url(#blue-arrow)}
      .backward{fill:none;stroke:#fb7185;stroke-width:3;marker-end:url(#red-arrow)}
    </style>
  </defs>
  <rect width="1000" height="680" rx="18" fill="#080c14"/>
  <text x="32" y="42" class="title">Computation Graph: Forward and Backward Propagation</text>
  <rect x="20" y="62" width="960" height="222" rx="14" fill="#0d1626" stroke="#60a5fa"/>
  <text x="40" y="94" class="heading">Forward pass (left to right): compute the output</text>
  <text x="40" y="126" class="label">J = 3(A + BC)</text>

  <circle cx="160" cy="164" r="25" class="input"/><text x="152" y="171" class="math" fill="#0f172a">B</text><text x="139" y="204" class="small">B = 3</text>
  <circle cx="160" cy="242" r="25" class="input"/><text x="152" y="249" class="math" fill="#0f172a">C</text><text x="139" y="278" class="small">C = 2</text>
  <circle cx="430" cy="242" r="25" class="input"/><text x="422" y="249" class="math" fill="#0f172a">A</text><text x="409" y="278" class="small">A = 5</text>
  <rect x="265" y="170" width="130" height="56" rx="9" class="node"/><text x="288" y="203" class="math">U = BC</text>
  <rect x="525" y="170" width="150" height="56" rx="9" class="node"/><text x="545" y="203" class="math">V = A + U</text>
  <rect x="785" y="170" width="130" height="56" rx="9" class="node"/><text x="815" y="203" class="math">J = 3V</text>
  <path d="M185 164 L263 187" class="forward"/><path d="M185 242 L263 209" class="forward"/>
  <path d="M395 198 L523 198" class="forward"/><path d="M455 242 L520 215" class="forward"/><path d="M675 198 L783 198" class="forward"/>
  <text x="294" y="250" class="value">U = 6</text><text x="570" y="250" class="value">V = 11</text><text x="817" y="250" class="value">J = 33</text>

  <rect x="20" y="300" width="960" height="310" rx="14" fill="#160f25" stroke="#c084fc"/>
  <text x="40" y="334" class="heading">Backward pass (right to left): compute derivatives with the chain rule</text>
  <rect x="205" y="418" width="110" height="54" rx="9" class="node"/><text x="224" y="450" class="math">U = BC</text>
  <rect x="405" y="418" width="135" height="54" rx="9" class="node"/><text x="421" y="450" class="math">V = A + U</text>
  <rect x="610" y="418" width="105" height="54" rx="9" class="node"/><text x="631" y="450" class="math">J = 3V</text>
  <circle cx="95" cy="397" r="24" class="input"/><text x="87" y="404" class="math" fill="#0f172a">B</text>
  <circle cx="95" cy="493" r="24" class="input"/><text x="87" y="500" class="math" fill="#0f172a">C</text>
  <circle cx="350" cy="518" r="24" class="input"/><text x="342" y="525" class="math" fill="#0f172a">A</text>
  <path d="M610 445 L542 445" class="backward"/><text x="552" y="425" class="value">dV = 3</text>
  <path d="M405 437 L317 437" class="backward"/><text x="330" y="417" class="value">dU = 3</text>
  <path d="M426 470 L374 506" class="backward"/><text x="396" y="500" class="value">dA = 3</text>
  <path d="M205 433 L120 402" class="backward"/><text x="132" y="386" class="value">dB = 6</text>
  <path d="M205 457 L120 488" class="backward"/><text x="132" y="515" class="value">dC = 9</text>

  <rect x="720" y="346" width="240" height="260" rx="12" fill="#111827" stroke="#f0abfc"/>
  <text x="738" y="375" class="heading">Chain rule in action</text>
  <text x="738" y="404" class="small">dJ/dV = 3</text>
  <text x="738" y="433" class="small">dJ/dA = dJ/dV &#183; dV/dA</text>
  <text x="758" y="453" class="value">= 3 &#183; 1 = 3</text>
  <text x="738" y="480" class="small">dJ/dU = dJ/dV &#183; dV/dU</text>
  <text x="758" y="500" class="value">= 3 &#183; 1 = 3</text>
  <text x="738" y="527" class="small">dJ/dB = dJ/dU &#183; dU/dB</text>
  <text x="758" y="547" class="value">= 3 &#183; C = 6</text>
  <text x="738" y="574" class="small">dJ/dC = dJ/dU &#183; dU/dC</text>
  <text x="758" y="594" class="value">= 3 &#183; B = 9</text>

  <rect x="20" y="626" width="960" height="34" rx="10" fill="#10351f"/>
  <text x="40" y="649" class="small">Each local derivative is multiplied by the gradient flowing backward from the final output J.</text>
</svg>
